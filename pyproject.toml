[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-orchestrator"
version = "0.1.0"
description = "Profile-safe Playwright CLI orchestration for OpenCode and Claude Code"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
playwright-orchestrator = "playwright_orchestrator.cli:main"
playwright-profile = "playwright_orchestrator.cli:main"
playwright-orchestrator-mcp = "playwright_orchestrator.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
